services:
  # Backend API + Matchmaking
  backend:
    build:
      context: .
      dockerfile: FarmDefenseHarvestWars.Backend/Dockerfile
    container_name: farm_backend
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/game.db
      - ASPNETCORE_ENVIRONMENT=Production
      - GodotServer__Host=0.0.0.0
      - GodotServer__BackendBaseUrl=http://backend:80
    ports:
      - "5177:80"
      - "7777-7800:7777-7800" # Match server ports
    volumes:
      - farm_data:/app/data

volumes:
  farm_data:
